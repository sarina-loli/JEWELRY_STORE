<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

       Jewelry

        {% endblock %}

    </title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<header>

    <nav>

        <div class="logo">

            <a href="{% url 'products:product_list' %}">

                JEWELRY STORE 

            </a>

        </div>

        <ul>

            <li>

                <a href="{% url 'products:product_list' %}">

                    Products

                </a>

            </li>

            <li>

                <a href="{% url 'cart:cart_detail' %}">

                    Cart

                </a>

            </li>

            {% if user.is_authenticated %}

                <li>

                    <a href="{% url 'accounts:dashboard' %}">

                        Dashboard

                    </a>

                </li>

                <li>

                    <a href="{% url 'accounts:profile' %}">

                        Profile

                    </a>

                </li>

                <li>

                    <a href="{% url 'orders:order_history' %}">

                        Orders

                    </a>

                </li>

                <li>

                    <a href="{% url 'accounts:logout' %}">

                        Logout

                    </a>

                </li>

            {% else %}

                <li>

                    <a href="{% url 'accounts:login' %}">

                        Login

                    </a>

                </li>

                <li>

                    <a href="{% url 'accounts:register' %}">

                        Register

                    </a>

                </li>

            {% endif %}

        </ul>

    </nav>

</header>

<main>

    {% block content %}

    {% endblock %}

</main>

<footer>

    <p>

        &copy; 2026 JEWELRY STORE  

    </p>

</footer>

</body>

</html>
